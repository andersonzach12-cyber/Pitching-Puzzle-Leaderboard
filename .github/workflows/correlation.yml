name: uScore correlation check (manual)

on:
  workflow_dispatch: {}   # only runs when YOU click "Run workflow" in GitHub -- never on a schedule

jobs:
  correlate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt scipy

      - name: Run correlation analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: pipeline
        run: python correlation_analysis.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: correlation-report
          path: pipeline/correlation_report.md
